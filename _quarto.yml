project:
  type: default
  output-dir: _site
  # Only render chapter sources; README.md etc. stay out of the site.
  render:
    - "ch*/**/*.qmd"
  # Copied verbatim into _site.
  resources:
    - index.html
    - .nojekyll
    - assets/
    - "ch*/**/animations/"
    - "ch*/**/figures/"
    - "ch*/**/files/"

# Course language: also translates Quarto's own labels (table of contents, etc.).
lang: pt-BR

# Shared settings for every chapter. Each chapter's front matter only sets
# its title and the two output file names.
format:
  html:
    theme: [cosmo, styles/lecture.scss]
    toc: true
    toc-depth: 3
    toc-expand: true
    # Section numbers are written in the headings (## 1.1, ### 1.1.1) to
    # match the book's table of contents.
    number-sections: false
    html-math-method: mathjax
    code-copy: true
    smooth-scroll: true
    include-before-body:
      - text: '<a class="home-link" href="../../index.html">← Página do curso</a>'
  revealjs:
    theme: [default, styles/slides.scss]
    # "## 1.1" = section slide, "### 1.1.1" = one content slide.
    slide-level: 3
    slide-number: c/t
    hash-type: title
    width: 1280
    height: 760
    margin: 0.06
    menu: true
    controls-layout: bottom-right
    transition: fade
    transition-speed: fast
    preview-links: auto
    chalkboard: true
    html-math-method: mathjax
